#
# cargo-about собирает тексты лицензий зависимостей в
# THIRD-PARTY-LICENSES.html, он входит в каждый пакет выпуска. Список
# лицензий - тот же, что в deny.toml.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "IJG",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700\
&family=Golos+Text:wght@400;500;600&display=swap');
:root{
  --paper:#EEF2F6; --paper-2:#E2E8EF; --ink:#131C26; --ink-soft:#4A5866;
  --teal:#1D5FA8; --teal-deep:#12457D; --amber:#C2622C;
  --line:rgba(19,28,38,.14); --r:14px; --maxw:1080px;
  --display:'Bitter',Georgia,serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;
  letter-spacing:-.01em}
p{margin:0}
code{font-size:.92em}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-deep);margin-bottom:18px;
  display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(238,242,246,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;
  font-family:var(--display);font-weight:700;text-decoration:none;
  font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
.nav a.on{color:var(--teal-deep);font-weight:600}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:20ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;
  color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
section .sub a{color:var(--teal-deep)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:34px}
@media(max-width:860px){.pair,.trio{grid-template-columns:1fr}}
.pair figure,.trio figure{margin:0}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.card p + p{margin-top:10px}
.card a{color:var(--teal-deep)}
.card.link{display:block;text-decoration:none;color:inherit}
.card.link:hover{border-color:var(--teal)}
.card.link h3{color:var(--teal-deep)}
figure{margin:30px 0 0}
figure img{width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#000}
.shot{margin-top:38px}
figcaption{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.tools{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.row{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:14px;
  padding:12px 20px;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row span{color:var(--ink-soft)}
@media(max-width:860px){.row{grid-template-columns:1fr;gap:4px}}
.release{margin-top:20px}
.release ul{margin:10px 0;padding-left:20px;color:var(--ink-soft);
  font-size:16px}
.release li + li{margin-top:6px}
.release p{color:var(--ink-soft);font-size:16px;margin-top:10px}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}
</style>

User guide", "cta.manual.url": "https://github.com/Valery35/planetx-lite/blob/main/doc/manual/MANUAL.en.md", "tasks.places.h": "Places and tours", "tasks.places.p": "Placemarks, paths, polygons and circles, the ruler and an elevation profile, tours, flight recording, the time slider, scenes and links to a view.", "tasks.data.h": "Earth data", "tasks.data.p": "Contours, slopes, geology, earthquakes, volcanoes, fires, currents, energy, 3D buildings, NASA layers and own files.", "tasks.sky.h": "The sky and other bodies", "tasks.sky.p": "Mars, the Moon and other bodies with imagery and terrain. The starry sky with constellations, planets and deep-sky objects.", "tasks.eyebrow": "What you can do", "tasks.h2": "From placemarks and tours to the starry sky", "idea.fig": "The program window over Perm from 14 km. Search, My Places with demo folders and Layers on the left, the icon bar on top.", "idea.c1.h": "Base map and terrain", "idea.c1.p": "Esri World Imagery, the OpenStreetMap map or ready base maps of the catalog. Terrain Tiles relief, the sea floor, an own GeoTIFF elevation raster.", "idea.c2.h": "Upright labels", "idea.c2.p": "Names of countries, cities, rivers and peaks from the OpenFreeMap vector base. The label language is that of the interface, local or one of 16.", "idea.c3.h": "Atmosphere and light", "idea.c3.p": "The glow of the air, the sky at the horizon, the sun for a date and time, the night side with city lights.", "idea.eyebrow": "How the globe works", "idea.h2": "One code for the computer and the browser", "idea.sub": "Lite is written in Rust and draws the globe with wgpu - Vulkan, DirectX 12, Metal or OpenGL. The web page is the same program in WebAssembly. World coordinates are computed in double precision, only offsets from the tile centre and from the eye reach the graphics card, the picture does not jitter at street level. The network never holds up a frame.", "phone.c1.h": "Phone", "phone.c1.p": "One finger turns the globe, a pinch zooms, two fingers turn and tilt the view. A long press on an icon shows a tooltip.", "phone.c2.h": "A link to a view", "phone.c2.p": "The Share view button builds a link with the camera and the scene. On a phone the system Share window opens.", "phone.c3.h": "Own places", "phone.c3.p": "My Places of the page are kept in the browser. A scene saves to a file and opens in the program and in the plugin.", "phone.eyebrow": "The web page", "phone.h2": "Nothing to install, on a phone too", "phone.sub": "The page works in Chrome, Edge, Firefox and Safari. It installs on the home screen of a phone and works offline on an opened scene. A link with the scene and pose parameters opens a scene and a view. Some layers are not available in a browser because of its restrictions, the program has them.", "ctl.r1.h": "Left button", "ctl.r1.p": "Grab the Earth. After a throw the globe keeps turning. A double click flies closer.", "ctl.r2.h": "Wheel", "ctl.r2.p": "Zoom to the point under the cursor, the point stays in place.", "ctl.r3.h": "Middle button", "ctl.r3.p": "Turn and tilt, Shift with the left button too. Ctrl with the left button shifts the view along the screen.", "ctl.r4.h": "N, U, R", "ctl.r4.p": "North up, a straight down view, both. The arrows turn the globe, Page Up and Page Down zoom.", "ctl.r5.h": "Ctrl+K", "ctl.r5.p": "The search line: a place, coordinates or a program action by name.", "ctl.r6.h": "F11", "ctl.r6.p": "Full screen for a show. The panels hide, navigation and the time slider stay.", "controls.eyebrow": "Controls", "controls.h2": "Mouse, keys and fingers", "dl.h1": "Windows", "dl.p1": "The setup.exe installer or a portable zip.", "dl.h2": "Linux", "dl.p2": "AppImage or tar.gz for x86_64.", "dl.h3": "macOS", "dl.p3": "dmg for Apple Silicon and for Intel.", "dl.note": "The files are not signed. The system warns about every program from an unknown publisher. On Windows choose More info and Run anyway, on macOS System Settings, Privacy &amp; Security, Open Anyway. Checksums are in SHA256SUMS of the release.", "download.eyebrow": "Download", "download.h2": "A program for three systems", "download.sub": "Releases are on GitHub. The program is free and open source, Apache 2.0 license.", "pro.a": "The PlanetX plugin page", "pro.eyebrow": "The PlanetX family", "pro.h2": "Lite and the QGIS plugin", "pro.sub": "The PlanetX plugin for QGIS edits data, analyses it and prepares scenes. Lite shows them and tells their story. Files connect them: the .planetx scene and KML. A scene from the plugin opens in Lite, a scene from Lite opens in the plugin.", "title": "PlanetX Lite - Overview · Inform++", "brand.sub": "globe without QGIS", "nav.main": "Overview", "nav.places": "Places and tours", "nav.data": "Data", "nav.sky": "Sky and bodies", "nav.news": "What's new", "ftr.line1": "Apache 2.0 license", "ftr.line2": "Inform++ LLC", "ftr.line3": "The program is free and open source.", "ftr.support": "Support development"}};

function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-i18n-href]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-href')];
    if (value !== undefined) el.setAttribute('href', value);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('planetx-lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){ apply(b.getAttribute('data-lang')); });
});
// По умолчанию русский: страница живёт на русском сайте.
var saved = null;
try { saved = localStorage.getItem('planetx-lang'); } catch (e) {}
apply(saved || 'ru');
</script>

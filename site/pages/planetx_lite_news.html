@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700\
&family=Golos+Text:wght@400;500;600&display=swap');
:root{
  --paper:#EEF2F6; --paper-2:#E2E8EF; --ink:#131C26; --ink-soft:#4A5866;
  --teal:#1D5FA8; --teal-deep:#12457D; --amber:#C2622C;
  --line:rgba(19,28,38,.14); --r:14px; --maxw:1080px;
  --display:'Bitter',Georgia,serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;
  letter-spacing:-.01em}
p{margin:0}
code{font-size:.92em}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-deep);margin-bottom:18px;
  display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(238,242,246,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;
  font-family:var(--display);font-weight:700;text-decoration:none;
  font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
.nav a.on{color:var(--teal-deep);font-weight:600}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:20ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;
  color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
section .sub a{color:var(--teal-deep)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:34px}
@media(max-width:860px){.pair,.trio{grid-template-columns:1fr}}
.pair figure,.trio figure{margin:0}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.card p + p{margin-top:10px}
.card a{color:var(--teal-deep)}
.card.link{display:block;text-decoration:none;color:inherit}
.card.link:hover{border-color:var(--teal)}
.card.link h3{color:var(--teal-deep)}
figure{margin:30px 0 0}
figure img{width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#000}
.shot{margin-top:38px}
figcaption{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.tools{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.row{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:14px;
  padding:12px 20px;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row span{color:var(--ink-soft)}
@media(max-width:860px){.row{grid-template-columns:1fr;gap:4px}}
.online{margin-top:30px;height:min(78vh,760px);border-radius:var(--r);
  overflow:hidden;border:1px solid var(--line);background:#000}
.online iframe{width:100%;height:100%;border:0;display:block}
.release{margin-top:20px}
.release ul{margin:10px 0;padding-left:20px;color:var(--ink-soft);
  font-size:16px}
.release li + li{margin-top:6px}
.release p{color:var(--ink-soft);font-size:16px;margin-top:10px}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}
</style>

<script>
var TEXTS = {"ru": {"news.0_11_0": "<p>PlanetX Lite 0.11.0 - «Временные метки», одно меню анализа участка и разрезы подземной модели, как в модуле PlanetX для QGIS. Программа для Windows, Linux и macOS и та же программа страницей в браузере: <a target=\"_blank\" href=\"https://valery35.github.io/planetx-lite/\">https://valery35.github.io/planetx-lite/</a></p>\n<ul><li>«Временные метки»: своя строка под «Моими метками», при запуске она выделена, новые метки, пути и измерения ложатся в неё. Содержимое переносится в «Мои метки» или очищается. При закрытии программы с непустой папкой задаётся вопрос: «Сохранить», «Не сохранять» или «Отмена».</li><li>Новое ложится в выделенную папку. Ctrl и Shift выбирают несколько строк, меню и перетаскивание действуют на все.</li><li>Все инструменты собраны в подменю «Анализ участка», в том числе затопление, сток воды и уровень моря. Пункты меню названы короче: «Космоснимки…», «Видимость…», «Полёт», «Сведения о точке», «Начало маршрута».</li><li>Участок общий: он рисуется один раз, окно, открытое внутри него, берёт тот же участок, правка вершин доходит до открытых окон.</li><li>Сводка значений - среднее, разброс и квантили - в уклоне, инсоляции и затоплении, а также в описании сохранённого слоя.</li><li>«Разрез модели…» пути: окно в метрах с рельефом, пластами, скважинами, тоннелями и объектами с Z из полосы вдоль линии. Слои выбираются флажками, цвета - правой кнопкой, разрез пишется картинкой и таблицей CSV.</li><li>«Стенка разреза модели» вдоль пути и «Вырез модели» по многоугольнику на глобусе.</li><li>«Космоснимки…» у пути и многоугольника: участок - метка.</li><li>Строки интерфейса переведены на все 16 языков.</li><li>Исправлено: левая панель сама росла на языках с длинной подписью кнопки. Легенды больше не закрывают окна.</li></ul>\n<p>Файлы не подписаны. Система предупреждает о любой программе неизвестного издателя, это не признак вируса. Windows покажет «Система Windows защитила ваш компьютер»: «Подробнее» - «Выполнить в любом случае». macOS не откроет программу с первого раза: «Системные настройки» - «Конфиденциальность и безопасность» - «Всё равно открыть». Проверка файлов - <code>SHA256SUMS</code>.</p>", "news.0_10_0": "<p>PlanetX Lite 0.10.0 - анализ участка, как в модуле PlanetX для QGIS. Программа для Windows, Linux и macOS и та же программа страницей в браузере: <a target=\"_blank\" href=\"https://valery35.github.io/planetx-lite/\">https://valery35.github.io/planetx-lite/</a></p>\n<ul><li>Подменю «Анализ участка» меню на глобусе. Участок - многоугольник: сначала квадрат у точки, его вершины тянутся мышью, участок можно нарисовать заново щелчками по глобусу.</li><li>У всех окон анализа одни кнопки: «Построить» показывает результат на глобусе, «OK» сохраняет его, «Отмена» убирает. Сохранённый расчёт ложится папкой в «Анализ участка» «Моих меток» вместе с контуром участка. Значения пишутся файлом GeoTIFF, его открывают QGIS и модуль PlanetX.</li><li>Новое: тени на момент шкалы времени, тени идут за бегунком.</li><li>Новое: изменения местности между двумя годами 2017-2025 и классификация участка по контрольным точкам на глобусе, обе по эмбеддингам AlphaEarth Foundations, клетка 10 м. Только в программе: хранилище данных не отдаёт файлы страницам в браузере.</li><li>Уклон и экспозиция, видимость, инсоляция, затопление и сток воды считаются по участку. Расчёты стока одного участка ложатся в одну папку.</li><li>Исправлено: слои расчётов не появлялись при выключенной векторной основе. Подменю меню на глобусе открываются наведением.</li></ul>\n<p>AlphaEarth Foundations Satellite Embedding - Google, Google DeepMind, CC BY 4.0.</p>\n<p>Файлы не подписаны. Система предупреждает о любой программе неизвестного издателя, это не признак вируса. Windows покажет «Система Windows защитила ваш компьютер»: «Подробнее» - «Выполнить в любом случае». macOS не откроет программу с первого раза: «Системные настройки» - «Конфиденциальность и безопасность» - «Всё равно открыть». Проверка файлов - <code>SHA256SUMS</code>.</p>", "news.0_9_0": "<p>PlanetX Lite 0.9.0 - глобус PlanetX без QGIS, по слоям и инструментам близкий к модулю PlanetX. Программа для Windows, Linux и macOS и та же программа страницей в браузере: <a target=\"_blank\" href=\"https://valery35.github.io/planetx-lite/\">https://valery35.github.io/planetx-lite/</a></p>\n<ul><li>Интерфейс как у модуля: панель значков над глобусом, каталог слоёв, меню на глобусе, окна «Настройки» и «Свойства вида», 16 языков интерфейса, тёмное и светлое оформление.</li><li>Слои: горизонтали, уклон и экспозиция, батиметрия, геологическая карта, землетрясения, вулканы, пожары, границы плит и разломы, ЛЭП, трубопроводы и кабели, электростанции, горные разработки, 3D-здания, течения, все слои NASA GIBS, службы WMS, космоснимки Sentinel-2 и Landsat, снимки до и после со шторкой, огни городов ночью.</li><li>Инструменты: определение точки, линейка, профиль и разрез вдоль пути, затопление и уровень моря, сток и водосбор, маршруты по дорогам, подземный режим, рисование и правка меток, шкала времени, запись облёта, кнопка «Поделиться».</li><li>Другие тела: Марс, Луна, другие планеты и спутники со снимками и рельефом. Звёздное небо с созвездиями, планетами и объектами глубокого неба.</li><li>Свои данные: растущие треки слоёв GeoPackage, облака лидара по сети, исторические карты с привязкой по опорным точкам.</li><li>Страница ставится на телефон и работает без сети на открытой сцене. На узком экране на панели остаются частые значки, прочие - в меню «…», долгое нажатие показывает подсказку.</li><li>Помощник ИИ и локальный сервер MCP для управления программой.</li></ul>\n<p>Часть слоёв на странице недоступна из-за ограничений браузера. В программе они есть.</p>\n<p>Файлы не подписаны. Система предупреждает о любой программе неизвестного издателя, это не признак вируса. Windows покажет «Система Windows защитила ваш компьютер»: «Подробнее» - «Выполнить в любом случае». macOS не откроет программу с первого раза: «Системные настройки» - «Конфиденциальность и безопасность» - «Всё равно открыть». Проверка файлов - <code>SHA256SUMS</code>.</p>", "news.0_1_0": "<p>Первый выпуск PlanetX Lite - глобус PlanetX без QGIS. Программа для Windows, Linux и macOS и та же программа страницей в браузере: <a target=\"_blank\" href=\"https://valery35.github.io/planetx-lite/\">https://valery35.github.io/planetx-lite/</a></p>\n<ul><li>Земля с рельефом, космоснимками Esri, картой OpenStreetMap и подписями OpenFreeMap, поиск места.</li><li>Сцены <code>.planetx</code> модуля PlanetX, файлы KML и KMZ: метки, пути, многоугольники, наложения, туры, шкала времени.</li><li>Свои данные: растры высот GeoTIFF и COG на рельефе, слои GeoPackage, облака точек LAS, LAZ и COPC, 3D-модели glTF и Collada.</li><li>«Мои метки», как в модуле: открытые сцены и файлы папками, меню правой кнопки, переименование, перетаскивание. Метки хранятся между запусками. Строка, папка или всё дерево сохраняется как KML, KMZ или сценой <code>.planetx</code>.</li><li>Меню «Демо» - сцены модуля из хранилища planetx-terrain.</li><li>Прототип аддинов: точки CSV читает аддин WebAssembly в песочнице.</li></ul>\n<p>Файлы не подписаны. Windows покажет «Система Windows защитила ваш компьютер»: «Подробнее» - «Выполнить в любом случае». macOS не откроет программу с первого раза: «Системные настройки» - «Конфиденциальность и безопасность» - «Всё равно открыть». Проверка файлов - <code>SHA256SUMS</code>.</p>", "news.all": "Все выпуски и файлы - на GitHub.", "cta.web": "Открыть в браузере", "cta.release": "Скачать программу", "cta.code": "Исходный код", "cta.manual": "Руководство", "cta.manual.url": "https://github.com/Valery35/planetx-lite/blob/main/doc/manual/MANUAL.ru.md", "news.eyebrow": "Что нового", "news.h2": "Изменения по выпускам", "title": "PlanetX Lite - Что нового · Информ++", "brand.sub": "глобус без QGIS", "nav.main": "Главная", "nav.online": "Онлайн", "nav.places": "Метки и туры", "nav.data": "Данные", "nav.sky": "Небо и тела", "nav.news": "Что нового", "ftr.line1": "Лицензия Apache 2.0", "ftr.line2": "ООО «Информ++»", "ftr.line3": "Программа бесплатная и открытая.", "ftr.support": "Поддержать разработку", "ftr.pro": "Модуль PlanetX для QGIS"}, "en": {"news.0_11_0": "<p>PlanetX Lite 0.11.0 - Temporary Places, one area analysis menu and sections of the subsurface model, as in the PlanetX plugin for QGIS. A program for Windows, Linux and macOS and the same program as a web page: <a target=\"_blank\" href=\"https://valery35.github.io/planetx-lite/\">https://valery35.github.io/planetx-lite/</a></p>\n<ul><li>Temporary Places: a row of its own under My Places, selected at start, new placemarks, paths and measurements go there. Its contents can be moved to My Places or cleared. When the program closes with items in the folder, it asks: Save, Don't save or Cancel.</li><li>New items go into the selected folder. Ctrl and Shift select several rows, the menu and dragging act on all of them.</li><li>All tools are in the submenu \"Area analysis\", flooding, water flow and sea level included. Menu items have shorter names: \"Satellite images…\", \"Viewshed…\", \"Flight\", \"Point details\", \"Route start\".</li><li>The area is shared: it is drawn once, a window opened inside it takes the same area, an edit of its vertices reaches the open windows.</li><li>A summary of the values - mean, spread and quantiles - in slope, insolation and flooding, also in the description of a saved layer.</li><li>Model section of a path: a window in metres with terrain, beds, drill holes, tunnels and objects with Z from a band along the line. Layers are chosen by checkboxes, colors by the right button, the section is saved as a picture and a CSV table.</li><li>Model section wall along a path and Model cut by a polygon on the globe.</li><li>Satellite images for a path or a polygon: the area is the placemark.</li><li>The interface strings are translated into all 16 languages.</li><li>Fixed: the left panel grew by itself in languages with a long button label. Legends no longer cover the windows.</li></ul>\n<p>The files are not signed. The system warns about every program from an unknown publisher, this is not a sign of a virus. On Windows choose \"More info\" - \"Run anyway\". On macOS open System Settings - Privacy &amp; Security - \"Open Anyway\". Checksums are in <code>SHA256SUMS</code>.</p>", "news.0_10_0": "<p>PlanetX Lite 0.10.0 - area analysis as in the PlanetX plugin for QGIS. A program for Windows, Linux and macOS and the same program as a web page: <a target=\"_blank\" href=\"https://valery35.github.io/planetx-lite/\">https://valery35.github.io/planetx-lite/</a></p>\n<ul><li>The submenu \"Area analysis\" of the menu on the globe. The area is a polygon: a square at the point first, its vertices are dragged with the mouse, the area can be drawn anew by clicks on the globe.</li><li>The same buttons in every analysis window: \"Build\" shows the result on the globe, \"OK\" saves it, \"Cancel\" removes it. A saved computation goes as a folder into \"Area analysis\" of \"My places\" with the outline of the area. The values are written as a GeoTIFF file that QGIS and the PlanetX plugin open.</li><li>New: shadows at the moment of the time slider, the shadows follow the slider.</li><li>New: changes of the terrain between two years 2017-2025 and the classification of an area by control points on the globe, both by the AlphaEarth Foundations embeddings, a 10 m cell. The program only: the storage of the data does not give files to web pages.</li><li>Slope and aspect, viewshed, insolation, flooding and water flow work on the area. The results of the water flow of one area go into one folder.</li><li>Fixed: the layers of computations did not show with the vector base off. Submenus of the menu on the globe open by hovering.</li></ul>\n<p>AlphaEarth Foundations Satellite Embedding - Google, Google DeepMind, CC BY 4.0.</p>\n<p>The files are not signed. The system warns about every program from an unknown publisher, this is not a sign of a virus. On Windows choose \"More info\" - \"Run anyway\". On macOS open System Settings - Privacy &amp; Security - \"Open Anyway\". Checksums are in <code>SHA256SUMS</code>.</p>", "news.0_9_0": "<p>PlanetX Lite 0.9.0 - the PlanetX globe without QGIS, now close to the PlanetX plugin in layers and tools. A program for Windows, Linux and macOS and the same program as a web page: <a target=\"_blank\" href=\"https://valery35.github.io/planetx-lite/\">https://valery35.github.io/planetx-lite/</a></p>\n<ul><li>Interface as in PlanetX: a toolbar over the globe, the layer catalog, menus on the globe, the Settings and View properties windows, 16 interface languages, dark and light appearance.</li><li>Layers: contours, slope and aspect, bathymetry, the geological map, earthquakes, volcanoes, fires, plate boundaries and faults, power lines, pipelines and cables, power plants, mines, 3D buildings, ocean currents, all NASA GIBS layers, WMS services, Sentinel-2 and Landsat imagery, before and after imagery with a swipe, city lights at night.</li><li>Tools: identify, ruler, profile and section along a path, flooding and sea level, drainage and watersheds, road routes, underground mode, placemark drawing and editing, time slider, tour recording, the Share button.</li><li>Other bodies: Mars, the Moon and other planets and moons with their imagery and terrain. The starry sky with constellations, planets and deep-sky objects.</li><li>Own data: growing tracks of GeoPackage layers, lidar point clouds over the network, historical maps georeferenced by control points.</li><li>The web page installs on a phone and works offline on an opened scene. On a narrow screen the toolbar keeps the frequent tools, the others are in the \"...\" menu, a long press shows a tooltip.</li><li>An AI assistant and a local MCP server to control the program.</li></ul>\n<p>Some layers are not available on the web page because of browser restrictions. The program has them.</p>\n<p>The files are not signed. The system warns about every program from an unknown publisher, this is not a sign of a virus. On Windows choose \"More info\" - \"Run anyway\". On macOS open System Settings - Privacy &amp; Security - \"Open Anyway\". Checksums are in <code>SHA256SUMS</code>.</p>", "news.0_1_0": "<p>The first release of PlanetX Lite, the PlanetX globe without QGIS. A program for Windows, Linux and macOS and the same program as a web page: <a target=\"_blank\" href=\"https://valery35.github.io/planetx-lite/\">https://valery35.github.io/planetx-lite/</a></p>\n<ul><li>The Earth with terrain, Esri imagery, the OpenStreetMap map and OpenFreeMap labels, place search.</li><li>PlanetX <code>.planetx</code> scenes, KML and KMZ: placemarks, paths, polygons, overlays, tours, time slider.</li><li>Own data: GeoTIFF and COG elevation on the terrain, GeoPackage layers, LAS, LAZ and COPC point clouds, glTF and Collada 3D models.</li><li>My Places, as in PlanetX: opened scenes and files as folders, a context menu, rename, drag and drop. Places are kept between runs. A row, a folder or the whole tree saves as KML, KMZ or a <code>.planetx</code> scene.</li><li>The Demo menu opens PlanetX demo scenes from the planetx-terrain repository.</li><li>Add-in prototype: CSV points are read by a sandboxed WebAssembly add-in.</li></ul>\n<p>The files are not signed. On Windows choose \"More info\" - \"Run anyway\". On macOS open System Settings - Privacy &amp; Security - \"Open Anyway\". Checksums are in <code>SHA256SUMS</code>.</p>", "news.all": "All releases and files are on GitHub.", "cta.web": "Open in the browser", "cta.release": "Download the program", "cta.code": "Source code", "cta.manual": "User guide", "cta.manual.url": "https://github.com/Valery35/planetx-lite/blob/main/doc/manual/MANUAL.en.md", "news.eyebrow": "What's new", "news.h2": "Changes by release", "title": "PlanetX Lite - What's new · Inform++", "brand.sub": "globe without QGIS", "nav.main": "Overview", "nav.online": "Online", "nav.places": "Places and tours", "nav.data": "Data", "nav.sky": "Sky and bodies", "nav.news": "What's new", "ftr.line1": "Apache 2.0 license", "ftr.line2": "Inform++ LLC", "ftr.line3": "The program is free and open source.", "ftr.support": "Support development", "ftr.pro": "The PlanetX plugin for QGIS"}};

function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-i18n-href]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-href')];
    if (value !== undefined) el.setAttribute('href', value);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('planetx-lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){ apply(b.getAttribute('data-lang')); });
});
// По умолчанию русский: страница живёт на русском сайте.
var saved = null;
try { saved = localStorage.getItem('planetx-lang'); } catch (e) {}
apply(saved || 'ru');
</script>

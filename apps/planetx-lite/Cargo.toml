[package]
name = "planetx-lite"
description = "PlanetX Lite - глобус PlanetX без QGIS, настольная программа"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Запуск и окно - общие с RustPlanetX.
desktop.workspace = true
# Чтение файлов через terrio и аддины - у Lite есть, у RustPlanetX нет.
ui = { workspace = true, features = ["full", "import", "addins"] }

# Значок и сведения о программе в exe под Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

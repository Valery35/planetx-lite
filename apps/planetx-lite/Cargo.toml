[package]
name = "planetx-lite"
description = "PlanetX Lite - глобус PlanetX без QGIS, настольная программа"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
net.workspace = true
ui.workspace = true
eframe.workspace = true
image.workspace = true

# Выбор X11 вместо Wayland, `display_server` в main.rs. Та же версия,
# что у eframe.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

# Значок и сведения о программе в exe под Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PlanetX Lite</title>
  <meta name="theme-color" content="#262a30">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PlanetX Lite">
  <link data-trunk rel="icon" href="favicon.png">
  <!-- Установка на телефон и работа без сети: манифест, значки,
       service worker (sw.js). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link data-trunk rel="copy-file" href="manifest.webmanifest">
  <link data-trunk rel="copy-file" href="sw.js">
  <link data-trunk rel="copy-file" href="icon-192.png">
  <link data-trunk rel="copy-file" href="icon-512.png">
  <link data-trunk rel="copy-file" href="icon-maskable-512.png">
  <link data-trunk rel="copy-file" href="apple-touch-icon.png">
  <link data-trunk rel="rust" data-bin="planetx-web" data-wasm-opt="0">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #globe { width: 100%; height: 100%; display: block; touch-action: none; }
    #report { position: fixed; left: 8px; top: 8px; margin: 0; color: #7f7; font: 12px monospace; white-space: pre; }
    /* Значок загрузки: виден, пока скачивается и запускается программа
       страницы. Его убирает main.rs после запуска. Цвета - тёмной темы
       Lite. */
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; color: #c8ccd2; font: 15px system-ui, sans-serif; }
    #loading .ring { width: 44px; height: 44px; border: 4px solid #3a4048; border-top-color: #4aa3ff; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="globe"></canvas>
  <div id="loading"><div class="ring"></div><div id="loading-text">PlanetX Lite</div></div>
  <pre id="report"></pre>
  <script>
    // Подпись значка на языке браузера: русский или английский.
    document.getElementById('loading-text').textContent =
      (navigator.language || '').startsWith('ru') ? 'PlanetX Lite загружается…' : 'PlanetX Lite is loading…';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.log('PlanetX Lite: service worker', e));
    }
  </script>
</body>
</html>

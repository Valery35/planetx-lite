[package]
name = "planetx-web"
description = "PlanetX Lite - глобус PlanetX без QGIS, страница в браузере"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
net.workspace = true
ui.workspace = true
eframe.workspace = true
# WebGL2 - запасной путь там, где нет WebGPU, например страница по http.
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCanvasElement", "Location", "Window", "console"] }

[lints]
workspace = true

#
# Проверка лицензий зависимостей: cargo deny check licenses.
# Lite выходит под Apache 2.0, зависимости - только под разрешительными
# лицензиями, GPL, LGPL и AGPL не берутся. Список - правило AGENTS.md.

[graph]
# Проверяются зависимости всех целей: программы и страницы.
all-features = false

[licenses]
confidence-threshold = 0.93
# BSL-1.0 нужна только крейтам буфера обмена под Windows, в графе cargo
# deny её может не оказаться. Неиспользованная разрешённая лицензия -
# не ошибка и не предупреждение.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    # Решение автора от 22 октября 2026 года, все пять разрешительные:
    # clipboard-win и error-code - буфер обмена egui на Windows.
    "BSL-1.0",
    # epaint_default_fonts - шрифты egui по умолчанию.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # unicode-ident - разбор кода Rust при сборке.
    "Unicode-3.0",
    # webpki-roots - корневые сертификаты HTTPS в ureq.
    "CDLA-Permissive-2.0",
    # Решение автора от 23 октября 2026 года: jpeg-encoder, его тянут
    # terrio и wbraster, - лицензия Independent JPEG Group, разрешительная.
    "IJG",
]

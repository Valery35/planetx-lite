[workspace]
resolver = "3"
members = [
    "crates/globe-core",
    "crates/terrain",
    "crates/data",
    "crates/scene",
    "crates/net",
    "crates/render",
    "crates/ui",
    "apps/planetx-lite",
    "apps/planetx-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ООО «Информ++»"]
repository = "https://github.com/Valery35/planetx-lite"

[workspace.dependencies]
globe-core = { path = "crates/globe-core" }
terrain = { path = "crates/terrain" }
data = { path = "crates/data" }
scene = { path = "crates/scene" }
net = { path = "crates/net" }
render = { path = "crates/render" }
ui = { path = "crates/ui" }
wgpu = "30"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
glam = "0.30"
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = "3"
dirs = "7"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui-wgpu = "0.37"
sys-locale = "0.3"
tiny_http = "0.12"
pollster = "0.4"
flate2 = "1"
serde_json = "1"
rfd = "0.17"
quick-xml = "0.42"
# Сжатие только на Rust: в наборе zip по умолчанию есть библиотеки на C
# (bzip2, zstd, lzma), под wasm32 они не собираются.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev.package."*"]
# Зависимости в отладочной сборке оптимизированы: декодер PNG и wgpu
# без этого тормозят кадр.
opt-level = 2

#
# Страница Lite на GitHub Pages, https://valery35.github.io/planetx-lite/.
# Решение автора от 23 октября 2026 года. Каждая отправка в main
# пересобирает страницу Trunk и выкладывает её. Пути в странице
# относительные - сайт живёт в папке /planetx-lite/.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Одна выкладка за раз, новая отправка отменяет ждущую.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Сборка страницы
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      # Те же версии, что на машине автора, Trunk.toml собирает без сети.
      - name: Trunk и wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.0,wasm-bindgen@0.2.129

      - name: Кэш Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: pages-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-${{ env.RUST_VERSION }}-

      - name: Страница
        working-directory: apps/planetx-web
        run: trunk build --release --locked --public-url ./

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Выкладка
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

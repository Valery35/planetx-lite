#
# Проверка каждой отправки в main и каждого запроса на слияние: тесты,
# clippy, сборка программы и страницы под wasm32, лицензии зависимостей.
# Тест дыр на видеокарте здесь пропускается - видеокарты на машине
# GitHub нет. Дыры проверяет самопроверка planetx-lite --check perm.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Версия Rust закреплена: новая версия приносит новые замечания clippy.
  # Совпадает с версией на машине автора, обновление - отдельным коммитом.
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always
  # .cargo/config.toml ограничивает сборку тремя потоками под память
  # машины автора, у машины GitHub памяти хватает.
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Тесты, clippy, wasm32, лицензии
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Системные библиотеки окна
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Кэш Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny
            target
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Тесты
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy под wasm32
        run: >
          cargo clippy --locked --target wasm32-unknown-unknown
          -p globe-core -p terrain -p data -p net -p render -p ui -p planetx-web -- -D warnings

      - name: Сборка под wasm32
        run: >
          cargo build --locked --target wasm32-unknown-unknown
          -p globe-core -p terrain -p data -p net -p render -p ui -p planetx-web

      - name: Лицензии зависимостей
        run: |
          command -v cargo-deny || cargo install cargo-deny --locked
          cargo deny check licenses

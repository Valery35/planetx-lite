# PlanetX Lite - глобус PlanetX без QGIS.
# Copyright (C) 2026 ООО «Информ++». Лицензия Apache 2.0.
# SPDX-License-Identifier: Apache-2.0
#
# Аддин-прототип: точки из CSV. Своё рабочее пространство - аддин
# собирается отдельно под wasm32-unknown-unknown:
#   cargo build --release --target wasm32-unknown-unknown
# и кладётся готовым файлом в crates/addin-host/addins/csv_points.wasm.

[workspace]

[package]
name = "csv-points"
description = "Аддин PlanetX Lite - точки из CSV"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ООО «Информ++»"]

[lib]
crate-type = ["cdylib"]

[dependencies]
addin-api = { path = "../../crates/addin-api" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1

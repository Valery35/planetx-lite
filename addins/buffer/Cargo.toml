# PlanetX Lite - глобус PlanetX без QGIS.
# Copyright (C) 2026 ООО «Информ++». Лицензия Apache 2.0.
# SPDX-License-Identifier: Apache-2.0
#
# Аддин-пример команды: буфер вокруг объекта. Своё рабочее пространство -
# аддин собирается отдельно под wasm32-unknown-unknown:
#   cargo build --release --target wasm32-unknown-unknown
# и кладётся готовым файлом в crates/addin-host/addins/buffer.wasm.

[workspace]

[package]
name = "buffer"
description = "Аддин PlanetX Lite - буфер вокруг точки, линии или полигона"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ООО «Информ++»"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
addin-api = { path = "../../crates/addin-api" }
# Буфер и объединение полигонов, MIT и Apache 2.0. Без набора по
# умолчанию: многопоточность не нужна в песочнице.
geo = { version = "0.33", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1

[package]
name = "ui"
description = "Интерфейс PlanetX Lite на egui - общий для программы и страницы"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["full", "import", "addins"]
# Темы слоёв каталога, doc/PLAN.md, «Как снять перегруз», правило 2.
# Строка реестра слоя (registry::ALL) и модуль слоя стоят под признаком
# своей темы. Ядро просмотра - «Мои слои», 3D Tiles, туры, метки, демо -
# признаком не закрывается. Программа и страница собираются со всеми
# темами, RustPlanetX - с темами из своего Cargo.toml.
full = ["live", "earth", "imagery", "analysis", "sky", "ai"]
# Живые слои: спутники, поезда, суда, самолёты, пожары, погода, течения.
live = []
# Науки о Земле: землетрясения, плиты, разломы, вулканы, геология, кора,
# магнитное поле, гравитация, почвы, вода.
earth = []
# Снимки и карты: Sentinel, Wayback, OAM, старые карты, AEF.
imagery = []
# Анализ участка: уклоны, видимость, объёмы, классы растров.
analysis = []
# Небо и тела.
sky = []
# Помощник ИИ.
ai = []
# Чтение файлов пользователя через terrio (data/import). У RustPlanetX
# его нет: данные приходят из RustGIS, doc/EDITIONS.md.
import = ["data/import"]
# Аддины в песочнице wasmi. У RustPlanetX их нет.
addins = ["dep:addin-host", "dep:sha2"]

[dependencies]
globe-core.workspace = true
terrain.workspace = true
data.workspace = true
addin-host = { workspace = true, optional = true }
# Сумма пакета аддина из каталога, MIT и Apache 2.0.
sha2 = { version = "0.10", optional = true }
addin-api.workspace = true
web-time.workspace = true
scene.workspace = true
assistant.workspace = true
serde_json.workspace = true
net.workspace = true
render.workspace = true
eframe.workspace = true
image.workspace = true
rfd.workspace = true
sys-locale = { workspace = true, features = ["js"] }
# Проверка файла системного шрифта, тот же разборщик, что у egui.
skrifa = "0.44"
# Цифры подписей горизонталей - встроенным шрифтом egui, контуры знаков
# заливаются в картинку.
epaint_default_fonts = "0.37"
tiny-skia.workspace = true
# Архив тайлов растра, нарезанного RustGIS (`rustgislink`).
zip.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
# Скачивание сохранённого файла на странице.
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Blob", "Document", "Element", "HtmlAnchorElement", "Location", "Url", "Window"] }

[lints]
workspace = true

[package]
name = "data"
description = "Данные PlanetX Lite - пункты векторных тайлов OpenMapTiles, поиск места Nominatim, свои растры и слои через terrio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
flate2.workspace = true
serde_json.workspace = true
terrio.workspace = true
tiny-skia.workspace = true
zip.workspace = true
# Триангуляция Делоне промеров (src/sounding.rs), MIT и Apache 2.0.
spade = "2"
# Распаковка тайлов COG (src/cog.rs): LZW и zstd на Rust, MIT и Apache 2.0.
# Те же версии уже собираются как зависимости terrio.
ruzstd = "0.9"
weezl = "0.2"
# Тайлы картинок COG (src/cog.rs): маленький TIFF с JPEG, LZW или deflate,
# MIT. Та же версия уже собирается как зависимость terrio.
tiff = { version = "0.11", default-features = false, features = ["deflate", "jpeg", "lzw"] }
# Файлы netCDF-4 минералов EMIT (src/emit.rs): чтение HDF5 на Rust, MIT
# и Apache 2.0. Та же версия, что у набора netcdf-hdf5 terrio.
netcdf-reader = { version = "=0.10.1", default-features = false, features = ["netcdf4"] }
# Разжатие LAZ и COPC облаков точек (src/cloud.rs), Apache 2.0. Та же
# версия уже собирается как зависимость terrio.
laz = "0.13"

[dev-dependencies]
# Тайлы JPEG для проверок картинок COG, MIT и Apache 2.0, та же версия
# у terrio.
jpeg-encoder = "0.7"
# Файл netCDF-4 сцены EMIT для проверки чтения, MIT и Apache 2.0, тот же
# набор крейтов, что у netcdf-reader.
netcdf-writer = "=0.10.1"

[lints]
workspace = true
